version: "3.9"

services:
  backend:
    build:
      context: ../..
      dockerfile: apiradar/devops/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/leakhub.db}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - leakhub_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  leakhub_data:
